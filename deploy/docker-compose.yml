# Production stack, managed by install.sh. Settings live in the adjacent .env
# (FINDO_MASTER_KEY is required; FINDO_VERSION and FINDO_PORT are optional).
services:
  findo:
    image: ghcr.io/timthehoff/findo:${FINDO_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${FINDO_PORT:-8080}:8080"
    volumes:
      - findo-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  findo-data:
