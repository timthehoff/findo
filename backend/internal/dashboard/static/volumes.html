<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volumes — Findo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/volumes.css">
</head>
<body>
  <nav class="topnav">
    <div class="brand-group">
      <a class="brand" href="/">🐾 Findo</a>
      <small class="version" data-version></small>
    </div>
    <a href="/">Search</a>
    <a href="/volumes.html" class="active">Volumes</a>
    <button class="icon-btn" data-theme-toggle></button>
  </nav>

  <div class="page-head">
    <h1>Volumes</h1>
    <button class="primary" id="addVolumeBtn">Add volume</button>
  </div>

  <div class="cards" id="cards">Fetching stats…</div>

  <section class="settings-card" aria-labelledby="contentHeading">
    <div class="settings-head">
      <h2 id="contentHeading">Content indexing</h2>
      <span id="contentState" class="badge"></span>
      <button type="button" id="pauseBtn" disabled>Pause</button>
    </div>
    <p class="muted settings-help">Search inside files, not just their names, for volumes that opt in (edit a volume to turn it on). Limits keep indexing bounded and gentle on the NAS.</p>
    <form id="contentForm" class="settings-grid">
      <label>Largest file to read (MB)
        <input type="number" id="csMaxFileMB" min="1" max="10240" step="any" required>
      </label>
      <label>Text kept per file (KB)
        <input type="number" id="csMaxTextKB" min="1" max="32768" step="any" required>
      </label>
      <label>Files read at once
        <input type="number" id="csWorkers" min="1" max="4" step="1" required>
      </label>
      <label>Pause between files (ms)
        <input type="number" id="csDelayMS" min="0" max="60000" step="1" required>
      </label>
      <div class="settings-actions"><button type="submit" id="contentSaveBtn" disabled>Save</button></div>
    </form>
  </section>

  <div id="volumes" class="volume-list">Fetching volumes…</div>

  <dialog id="volumeDialog">
    <form id="volumeForm">
      <h2 id="volumeDialogTitle" style="margin:0 0 0.25rem">Add volume</h2>
      <input type="hidden" id="volumeId">
      <label>Name <input type="text" id="vName" required></label>
      <label>Host <input type="text" id="vHost" required placeholder="nas.local or 192.0.2.10"></label>
      <label>Share <input type="text" id="vShare" required></label>
      <label>Username <input type="text" id="vUsername" required></label>
      <label>Password <input type="password" id="vPassword" placeholder="blank keeps the current one (required if you change host, share or username)" autocomplete="new-password"></label>
      <label class="check">
        <input type="checkbox" id="vContentIndex">
        <span>Search file contents<small class="muted">Index the text inside this volume's documents. Off by default.</small></span>
      </label>
      <div id="testResult"></div>
      <div class="dialog-actions">
        <button type="button" id="testBtn">Test connection</button>
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/volumes.js"></script>
</body>
</html>
