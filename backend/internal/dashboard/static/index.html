<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — Findo</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/search.css">
</head>
<body>
  <nav class="topnav">
    <div class="brand-group">
      <a class="brand" href="/">🐾 Findo</a>
      <small class="version" data-version></small>
    </div>
    <a href="/" class="active">Search</a>
    <a href="/volumes.html">Volumes</a>
    <button class="icon-btn" data-theme-toggle></button>
  </nav>

  <div class="page-head">
    <h1>Search &amp; Browse</h1>
    <label class="toggle"><input type="checkbox" id="showHidden"> Show hidden</label>
  </div>
  <div class="search-bar">
    <select id="volumeFilter"><option value="">all volumes</option></select>
    <input type="search" id="q" placeholder="Search all volumes…" autofocus>
  </div>
  <nav id="breadcrumbs" class="breadcrumbs"></nav>
  <div id="err"></div>
  <div id="count" class="count"></div>
  <ul id="results" class="results"></ul>

  <script type="module" src="/js/search.js"></script>
</body>
</html>
