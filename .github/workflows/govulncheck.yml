name: govulncheck

# Dependabot bumps modules but not the Go toolchain pinned in go.mod's `go`
# line, and known vulnerabilities appear in the standard library or in
# dependencies without any commit here. This fails when a vulnerability our
# code actually reaches has a fix available. (It can't see inside the PDFium
# WebAssembly blob: keep go-pdfium current through Dependabot.)
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, after Dependabot's run
  pull_request:
    paths:
      - backend/go.mod
      - backend/go.sum
      - .github/workflows/govulncheck.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: backend/go.mod
          work-dir: backend
          go-package: ./...
