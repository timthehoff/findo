name: Release

# Publishes prebuilt macOS binaries to a GitHub release when a version tag is
# pushed (git tag v1.2.3 && git push --tags, or a release published in GitHub's
# UI). deploy/macos/install.sh downloads them; 0.x releases are pre-releases.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    # macOS runner so the arm64 binary is ad-hoc signed by the real toolchain.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch \
              make -C backend build VERSION="$ver" BINARY="$PWD/dist/findo-server"
            tar -czf "dist/findo-server_${ver}_darwin_${arch}.tar.gz" -C dist findo-server
            rm dist/findo-server
          done
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published from GitHub's UI already exists by the time the
          # tag triggers this workflow; a bare `git push --tags` has none yet.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            flags=--generate-notes
            case "${GITHUB_REF_NAME#v}" in 0.*) flags="$flags --prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* $flags
          fi
